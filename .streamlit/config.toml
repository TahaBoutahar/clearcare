[server]
# run_streamlit.sh keeps it on this computer (127.0.0.1); a host such as Streamlit Cloud sets its own address.
maxUploadSize = 20

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"  # no developer menu ("Deploy") for doctors

[theme]
base = "light"
primaryColor = "#22654e"
backgroundColor = "#f5f7f6"
secondaryBackgroundColor = "#ffffff"
textColor = "#203a32"
font = "sans serif"
